AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Recursos documentais do domínio Inventory; não destinados a deploy nesta demonstração.
Resources:
  InventoryApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: demo
  GetInventoryBySkuFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DocumentationOnly: true
    Properties:
      Runtime: nodejs22.x
      Handler: not-implemented.handler
      CodeUri: not-implemented/
      Policies:
        - DynamoDBReadPolicy:
            TableName:
              Ref: InventoryTable
      Events:
        GetInventoryBySku:
          Type: Api
          Properties:
            RestApiId:
              Ref: InventoryApi
            Path: /inventory/{sku}
            Method: get
  InventoryCommandsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
  InventoryCommandsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt: [InventoryCommandsDeadLetterQueue, Arn]
        maxReceiveCount: 5
  ReserveInventoryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DocumentationOnly: true
    Properties:
      Runtime: nodejs22.x
      Handler: not-implemented.handler
      CodeUri: not-implemented/
      Policies:
        - DynamoDBCrudPolicy:
            TableName:
              Ref: InventoryTable
        - SQSPollerPolicy:
            QueueName:
              Fn::GetAtt: [InventoryCommandsQueue, QueueName]
      Events:
        InventoryCommands:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt: [InventoryCommandsQueue, Arn]
            BatchSize: 10
  InventoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sku
          AttributeType: S
      KeySchema:
        - AttributeName: sku
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true